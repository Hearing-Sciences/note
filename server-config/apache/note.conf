<VirtualHost *:80>
        DocumentRoot /var/www/html/note

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        <directory "/var/www/html/note">
                RewriteEngine On
                RewriteBase "/"
                RewriteRule "^data/([a-zA-Z0-9\-_]+)$" "/data.php?data/$1" [END]
                RewriteRule "^([\/a-zA-Z0-9\-_]+)$" "/index.php?$1" [END]
        </directory>
        <directory "/var/www/note/html/libs">
                Options -Indexes
                RewriteEngine Off
        </directory>
</VirtualHost>
